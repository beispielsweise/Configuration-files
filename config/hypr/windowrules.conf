##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# NOTE: Set up with tampermonkey script
# Browser
windowrule {
    name = firefox_youtube
    match:class = ^(firefox)$
    match:title = ^Youtube.*
    opacity = 1.0 override 1.0 override 1.0 override
    no_blur = on
}

windowrule {
    name = firefox_hdrezka
    match:class = ^(firefox)$
    match:title = ^Hd-rezka.*
    opacity = 1.0 override 1.0 override 1.0 override
    no_blur = on
}

# Discord
windowrule {
    name = discord1
    match:class = ^(discord)$
    match:title = ^squad.*
    opacity = 1.0
    no_blur = on
}

# Scrcpy
windowrule {
    name = scrcpy
    match:class = ^(scrcpy)$
    opacity = 1.0
    no_blur = on
}

# YAD
windowrule {
    name = yad_float
    match:class = ^(yad)$
    float = on
}

windowrule {
    name = yad_screenshot_noanim
    match:class = ^(yad)$
    match:title = ^Screenshot
    no_anim = on
}

# Imv
windowrule {
    name = imv_float
    match:class = ^(imv)$
    float = on
    no_blur = on
}

windowrule {
    name = imv_maximize
    match:class = ^(imv)$
    maximize = on
    no_blur = on
}

windowrule {
    name = imv_opaque
    match:class = ^(imv)$
    opacity = 1.0
    no_blur = on
}

# Mpv
windowrule {
    name = mpv_float
    match:class = ^(mpv)$
    float = on
    no_blur = on
}

windowrule {
    name = mpv_maximize
    match:class = ^(mpv)$
    maximize = on
    no_blur = on
}

windowrule {
    name = mpv_opaque
    match:class = ^(mpv)$
    opacity = 1.0
    no_blur = on
}

# CopyQ
windowrule {
    name = copyq_float
    match:class = ^(copyq)$
    float = on
    no_blur = on
}

# JetBrains
windowrule {
    name = jetbrains_win_float_noinitialfocus
    match:class = (jetbrains-)(.*)
    match:title = ^win(.*)
    match:initial_title = ^win.*
    match:float = on
    no_initial_focus = on
}

# XWayland dragging workaround (old: nofocus, empty class/title, xwayland:1, floating:1, fullscreen:0, pinned:0)
windowrule {
    name = xwayland_empty_drag_fix
    match:class = ^$
    match:title = ^$
    match:xwayland = on
    match:float = on
    match:fullscreen = off
    match:pin = off
    no_focus = on
}

# xwaylandvideobridge 
windowrule {
    name = xwaylandvideobridge_hide
    match:class = ^(xwaylandvideobridge)$
    opacity = 0.0
    no_anim = on
    no_initial_focus = on
}
